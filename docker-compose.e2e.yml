services:
  webdav-test:
    image: bytemark/webdav
    container_name: webdav-e2e-test
    environment:
      AUTH_TYPE: Basic
      USERNAME: e2etest
      PASSWORD: e2etest123
    ports:
      - "8090:80"
    volumes:
      - ./data/webdav:/var/lib/dav
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 5s
      timeout: 3s
      retries: 5
