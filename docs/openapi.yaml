openapi: 3.0.3
info:
  title: WebDAV EasyAccess API
  description: REST API for WebDAV EasyAccess. See also shared-contracts.md for error formats and shared constants.
  version: 1.0.0
servers:
  - url: /api
    description: API base path
security:
  - bearerAuth: []
securityDefinitions: {}

paths:
  /auth/register:
    post:
      summary: Sign up
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        '201':
          description: Registration success
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageCode: { type: string }
                  status: { type: string }
                  user: { $ref: '#/components/schemas/UserBasic' }
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageCode: { type: string }
                  token: { type: string }
                  refreshToken: { type: string }
                  user: { $ref: '#/components/schemas/UserBasic' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          description: Too many login attempts (rate limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          $ref: '#/components/responses/Error'

  /auth/me:
    get:
      summary: Current user info
      tags: [Auth]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /users:
    get:
      summary: List users
      tags: [Users]
      responses:
        '200':
          description: List of users
        '401':
          $ref: '#/components/responses/Error'

  /users/approved:
    get:
      summary: List approved users
      tags: [Users]
      responses:
        '200':
          description: List of approved users
        '401':
          $ref: '#/components/responses/Error'

  /users/{id}:
    get:
      summary: Get user by id
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User object
        '401':
          $ref: '#/components/responses/Error'

  /users/{id}/password:
    put:
      summary: Change password
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /users/{id}/email:
    put:
      summary: Update email
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /users/{id}/permissions:
    put:
      summary: Set user folder permissions (admin only)
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items:
                    type: object
                    properties:
                      folderPath: { type: string }
                      permission: { type: string }
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /files/list:
    get:
      summary: List folder contents
      tags: [Files]
      parameters:
        - name: path
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Array of file/folder items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    basename: { type: string }
                    type: { type: string, enum: [file, directory] }
                    size: { type: integer }
                    lastmod: { type: string }
                    hasReadPermission: { type: boolean }
                    hasWritePermission: { type: boolean }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /files/download:
    get:
      summary: Download file
      tags: [Files]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: inline
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: File binary
          content:
            application/octet-stream: {}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /files/upload:
    post:
      summary: Upload file
      tags: [Files]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                path: { type: string }
                relativePath: { type: string }
                onConflict: { type: string, enum: [error, overwrite, skip] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageCode: { type: string }
                  path: { type: string }
                  skipped: { type: boolean }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /files/rename:
    put:
      summary: Rename file or folder
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPath, newName]
              properties:
                oldPath: { type: string }
                newName: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageCode: { type: string }
                  path: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /files/batch-move:
    post:
      summary: Move items (bulk job)
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moves]
              properties:
                moves:
                  type: array
                  items:
                    type: object
                    required: [sourcePath, destinationPath]
                    properties:
                      sourcePath: { type: string }
                      destinationPath: { type: string }
                onConflict: { type: string, enum: [error, overwrite, skip] }
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /files/batch-copy:
    post:
      summary: Copy items (bulk job)
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copies]
              properties:
                copies:
                  type: array
                  items:
                    type: object
                    required: [sourcePath, destinationPath]
                    properties:
                      sourcePath: { type: string }
                      destinationPath: { type: string }
                onConflict: { type: string, enum: [error, overwrite, skip] }
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /files/batch-delete:
    post:
      summary: Delete items (bulk job)
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  items: { type: string }
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /files/bulk-operation/{jobId}:
    get:
      summary: Get bulk operation status
      tags: [Files]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  progress: { type: integer }
                  total: { type: integer }
                  results: { type: array }
                  errorMessage: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /files/bulk-operation/{jobId}/cancel:
    post:
      summary: Cancel bulk operation
      tags: [Files]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageCode: { type: string }
                  jobId: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /files/download-multiple:
    post:
      summary: ZIP multiple files/folders
      tags: [Files]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paths: { type: array, items: { type: string } }
                downloadId: { type: string }
      responses:
        '200':
          description: ZIP file binary
          content:
            application/zip: {}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /files/download-progress/{id}:
    get:
      summary: Progress of ZIP download
      tags: [Files]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Progress object
        '404':
          $ref: '#/components/responses/Error'

  /files/thumbnail/{hash}:
    get:
      summary: Single thumbnail (JWT auth)
      tags: [Files]
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Thumbnail image binary
          content:
            image/jpeg: {}
            image/png: {}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /files/operation-progress/{id}:
    get:
      summary: Progress of bulk operation (move/copy/delete)
      tags: [Files]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Progress object
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /files/check-conflicts:
    post:
      summary: Check name conflicts before paste
      tags: [Files]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operations: { type: array }
                limit: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts: { type: array }
        '401':
          $ref: '#/components/responses/Error'

  /files/metadata:
    post:
      summary: Get file metadata
      tags: [Files]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paths: { type: array, items: { type: string } }
      responses:
        '200':
          description: Array of metadata objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    size: { type: integer }
                    lastmod: { type: string }
                    mime: { type: string }
        '401':
          $ref: '#/components/responses/Error'

  /files/thumbnails/batch:
    post:
      summary: Batch thumbnails
      tags: [Files]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paths: { type: array, items: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  thumbnails: { type: array }
        '401':
          $ref: '#/components/responses/Error'

  /folders/create:
    post:
      summary: Create folder
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageCode: { type: string }
                  path: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /permissions/grant:
    post:
      summary: Grant folder or file permission
      tags: [Permissions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folderPath: { type: string }
                userId: { type: string }
                permission: { type: string, enum: [read, write, admin] }
                target: { type: string, enum: [file] }
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /permissions/revoke:
    delete:
      summary: Revoke permission
      tags: [Permissions]
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
        - name: folderPath
          in: query
          required: true
          schema: { type: string }
        - name: includeSubfolders
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: scope
          in: query
          description: 'pathOnly for file-level revoke only'
          schema: { type: string, enum: [pathOnly] }
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  messageCode: { type: string }

  /settings/public:
    get:
      summary: Public settings
      tags: [Settings]
      security: []
      responses:
        '200':
          description: Public settings (e.g. signup enabled)

  /webdav/info:
    get:
      summary: WebDAV URL info
      tags: [Health]
      security: []
      responses:
        '200':
          description: WebDAV info for UI

  /webdav/test:
    get:
      summary: Test WebDAV connection
      tags: [Health]
      security: []
      responses:
        '200':
          description: Connection test result

  /thumbnails/{hash}.{ext}:
    get:
      summary: Thumbnail by hash and extension (token in query)
      tags: [Files]
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: ext
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Thumbnail image
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /permissions/user/{userId}:
    get:
      summary: List permissions for a user
      tags: [Permissions]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Array of permission objects
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /permissions/folder:
    get:
      summary: List permissions for a folder
      tags: [Permissions]
      parameters:
        - name: path
          in: query
          schema: { type: string }
        - name: includeSubfolders
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: filePath
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Array of permission objects
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /permissions/check:
    get:
      summary: Check current user permission for a path
      tags: [Permissions]
      parameters:
        - name: path
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Permission info
        '401':
          $ref: '#/components/responses/Error'

  /permissions/file/grant:
    post:
      summary: Grant file-level permission
      tags: [Permissions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filePath: { type: string }
                userId: { type: string }
                permission: { type: string, enum: [read, write, admin] }
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /permissions/file/revoke:
    delete:
      summary: Revoke file-level permission
      tags: [Permissions]
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
        - name: filePath
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /permissions/file:
    patch:
      summary: Update file-level permission
      tags: [Permissions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Error'

  /permissions/file/check:
    get:
      summary: Check file permission
      tags: [Permissions]
      parameters:
        - name: path
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Permission check result
        '401':
          $ref: '#/components/responses/Error'

  /permissions/file/list:
    get:
      summary: List file permissions
      tags: [Permissions]
      parameters:
        - name: folderPath
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Array of permissions
        '401':
          $ref: '#/components/responses/Error'

  /permission-requests:
    post:
      summary: Create permission request
      tags: [Permission Requests]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folderPath: { type: string }
                filePath: { type: string }
                permission: { type: string }
                message: { type: string }
      responses:
        '200':
          description: Created request
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /permission-requests/inbox:
    get:
      summary: Incoming requests (for owners)
      tags: [Permission Requests]
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Array of requests
        '401':
          $ref: '#/components/responses/Error'

  /permission-requests/outbox:
    get:
      summary: Outgoing requests (for requesters)
      tags: [Permission Requests]
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Array of requests
        '401':
          $ref: '#/components/responses/Error'

  /permission-requests/check-owner:
    get:
      summary: Check if path has an owner
      tags: [Permission Requests]
      parameters:
        - name: folderPath
          in: query
          schema: { type: string }
        - name: filePath
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Owner check result
        '401':
          $ref: '#/components/responses/Error'

  /permission-requests/{id}/approve:
    post:
      summary: Approve permission request
      tags: [Permission Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated request
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /permission-requests/{id}/reject:
    post:
      summary: Reject permission request
      tags: [Permission Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated request
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /permission-requests/{id}/cancel:
    post:
      summary: Cancel own permission request
      tags: [Permission Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated request
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /share-links:
    post:
      summary: Create share link
      tags: [Share Links]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [filePath]
              properties:
                filePath: { type: string }
                expiresInDays: { type: integer }
      responses:
        '200':
          description: Created share link
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      summary: List own share links
      tags: [Share Links]
      responses:
        '200':
          description: Array of share links
        '401':
          $ref: '#/components/responses/Error'

  /share-links/{token}:
    get:
      summary: Get share link details
