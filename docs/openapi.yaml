components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserBasic:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        is_admin: { type: boolean }
        status: { type: string }
    User:
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          properties: {}
    ErrorResponse:
      type: object
      description: Consistent error format (shared-contracts.md)
      properties:
        errorCode:
          type: string
          description: i18n key for the error
        params:
          type: object
          description: Optional interpolation params for translation
        details:
          type: string
          description: Optional; only in development, may include stack trace

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
